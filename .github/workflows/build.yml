name: Build LaTeX PDF

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # required to create/upload to a GitHub Release
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0  # fetch full history + tags so git describe works

      - name: Generate version.tex from git tag
        run: |
          if VERSION=$(git describe --tags --dirty 2>/dev/null); then
            VERSION=${VERSION#v}  # strip leading "v" (e.g. v1.2.5 -> 1.2.5)
            printf '\\version{%s}\n' "$VERSION" > version.tex
            echo "Using git version: $VERSION"
          else
            VERSION=$(sed -n 's/.*\\version{\([^}]*\)}.*/\1/p' main.tex | head -n1)
            echo "No git tag found; using hardcoded version: $VERSION"
          fi
          # export the branding-compliant PDF name for later steps
          echo "PDF_NAME=pppx-manual-${VERSION}.pdf" >> "$GITHUB_ENV"

      - name: Compile LaTeX document
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          # minted requires shell escape and Pygments at compile time
          latexmk_shell_escape: true
          # the action's TeX Live image is Alpine-based; install Pygments for minted
          pre_compile: "apk add --no-cache py3-pygments"

      - name: Rename PDF
        run: mv main.pdf "$PDF_NAME"

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v5
        with:
          name: pppx-manual
          path: ${{ env.PDF_NAME }}

      - name: Attach PDF to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.PDF_NAME }}
