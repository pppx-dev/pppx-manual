name: Build LaTeX PDF

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile LaTeX document
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          # minted requires shell escape and Pygments at compile time
          latexmk_shell_escape: true
          # the action's TeX Live image is Alpine-based; install Pygments for minted
          pre_compile: "apk add --no-cache py3-pygments"

      - name: Rename PDF
        run: mv main.pdf PPPx_manual.pdf

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: PPPx_manual
          path: PPPx_manual.pdf
